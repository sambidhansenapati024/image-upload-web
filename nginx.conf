# ============================================================
# WebSocket connection handling
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# ============================================================
# HTTP → HTTPS
# ============================================================

server {
    listen 80;

    server_name cloudv.net.in www.cloudv.net.in api.cloudv.net.in;

    # Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# API + WebSocket
# ============================================================

server {
    listen 443 ssl;

    server_name api.cloudv.net.in;

    # SSL certificate
    ssl_certificate /etc/letsencrypt/live/cloudv.net.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudv.net.in/privkey.pem;

    # API / WebSocket proxy
    location / {

        proxy_pass http://backend:2627;

        proxy_http_version 1.1;

        # Forward original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep WebSocket/SockJS connections alive
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        # Important for WebSocket/SockJS
        proxy_buffering off;
    }
}


# ============================================================
# Angular Frontend
# ============================================================

server {
    listen 443 ssl;

    server_name cloudv.net.in www.cloudv.net.in;

    ssl_certificate /etc/letsencrypt/live/cloudv.net.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudv.net.in/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;

    # ========================================================
    # ONNX Runtime WASM
    # ========================================================

    location /ort/ {
        try_files $uri =404;

        types {
            application/javascript mjs;
            application/wasm wasm;
        }

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ========================================================
    # Angular
    # ========================================================

    location / {
        try_files $uri $uri/ /index.html;
    }
}