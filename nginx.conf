# HTTP → HTTPS
server {
    listen 80;
    server_name cloudv.net.in www.cloudv.net.in api.cloudv.net.in;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API
server {
    listen 443 ssl;
    server_name api.cloudv.net.in;

    ssl_certificate /etc/letsencrypt/live/cloudv.net.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudv.net.in/privkey.pem;

    location / {
        proxy_pass http://backend:2627;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Angular
server {
    listen 443 ssl;
    server_name cloudv.net.in www.cloudv.net.in;

    ssl_certificate /etc/letsencrypt/live/cloudv.net.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudv.net.in/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Clickjacking protection
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}