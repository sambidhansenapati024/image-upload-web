<div class="docs-page">

    <!-- Floating decorative elements -->
    <div class="floating-orb orb-one"></div>
    <div class="floating-orb orb-two"></div>
    <div class="floating-orb orb-three"></div>

    <div class="docs-content">

        <!-- Header -->
        <div class="content-header">

            <div class="header-icon">
                <i class="pi pi-book"></i>
            </div>

            <div class="header-text">

                <span class="category">
                    CLOUDVAULT DOCUMENTATION
                </span>

                <h1>
                    {{ topic.title }}
                </h1>

                <p>
                    {{ topic.description }}
                </p>

            </div>

        </div>


        <!-- Decorative line -->
        <div class="header-line"></div>


        <!-- Documentation body -->
        <div class="doc-body">

            @for (
                section of topic.sections;
                track section.heading
            ) {

                <section
                    class="doc-section"
                    [id]="getSectionId(section.heading)">

                    <div class="section-marker">
                        <i class="pi pi-angle-right"></i>
                    </div>

                    <div class="section-content">

                        <h2>
                            {{ section.heading }}
                        </h2>

                        <p>
                            {{ section.content }}
                        </p>

                    </div>

                </section>

            }

        </div>


        <!-- Navigation -->
        <div class="doc-navigation">

            <button
                pButton
                label="Previous"
                icon="pi pi-arrow-left"
                severity="secondary"
                variant="outlined"
                [disabled]="!previousTopic"
                (click)="goPrevious()"
                class="doc-nav-button previous-button">
            </button>


            <button
                pButton
                label="Next"
                icon="pi pi-arrow-right"
                iconPos="right"
                [disabled]="!nextTopic"
                (click)="goNext()"
                class="doc-nav-button next-button">
            </button>

        </div>

    </div>

</div>
