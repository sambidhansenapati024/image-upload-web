@if (visible) {

<div class="loading-overlay">

    <!-- Background -->
    <div class="loading-orbs">

        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>

    </div>


    <!-- Subtle grid -->
    <div class="loading-grid"></div>


    <!-- Loading Card -->
    <div class="loading-card">


        <!-- Security animation -->

        <div class="security-animation">

            <div class="outer-ring ring-1"></div>

            <div class="outer-ring ring-2"></div>

            <div class="outer-ring ring-3"></div>


            <div class="shield">

                <div class="shield-glow"></div>

                <i class="pi pi-shield"></i>

            </div>

        </div>


        <!-- Brand -->

        <div class="loading-brand">

            <span class="brand-dot"></span>

            <span>CloudVault</span>

        </div>


        <!-- Main message -->

        <h2>
            {{ message }}
        </h2>


        <p class="loading-description">
            Securing your request...
        </p>


        <!-- Status -->

        <div class="loading-status">

            <span class="status-dot"></span>

            <span>
                Please wait a moment
            </span>

        </div>


        <!-- Loading dots -->

        <div class="dots">

            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- Bottom security text -->

        <div class="security-footer">

            <i class="pi pi-lock"></i>

            <span>
                Secure connection
            </span>

        </div>

    </div>

</div>

}
