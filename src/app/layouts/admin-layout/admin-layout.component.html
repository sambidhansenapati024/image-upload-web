<div class="admin-layout">

    <!-- =====================================================
         ADMIN NAVBAR
         ===================================================== -->

    <header class="admin-navbar">

        <div class="admin-navbar-left">

            <div class="admin-logo">

                <i class="pi pi-cloud"></i>

                <span>
                    CloudVault
                </span>

            </div>

            <span class="admin-badge">
                ADMIN
            </span>

        </div>


        <!-- Admin User -->

        <div class="admin-navbar-right">

            <button
                type="button"
                class="admin-user-button"
                (click)="adminPopover.toggle($event)"
                aria-label="Open admin profile menu">

                <div class="admin-avatar">

                    @if (user?.profileImageUrl) {

                        <img
                            [src]="user?.profileImageUrl"
                            [alt]="user?.fullName || 'Profile image'">

                    } @else {

                        {{ user?.fullName?.charAt(0)?.toUpperCase() }}

                    }

                </div>


                <div class="admin-user-info">

                    <span class="admin-user-name">
                        {{ user?.fullName }}
                    </span>

                    <span class="admin-user-email">
                        {{ user?.email }}
                    </span>

                </div>


                <i class="pi pi-chevron-down"></i>

            </button>

        </div>

    </header>


    <!-- =====================================================
         ADMIN BODY
         ===================================================== -->

    <div class="admin-body">


        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside class="admin-sidebar">

            <nav class="admin-nav">

                <!-- Dashboard -->

                <a
                    routerLink="/admin"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{
                        exact: true
                    }">

                    <i class="pi pi-home"></i>

                    <span>
                        Dashboard
                    </span>

                </a>


                <!-- Support Queries -->

                <a
                    routerLink="/admin/support-queries"
                    routerLinkActive="active">

                    <i class="pi pi-comments"></i>

                    <span>
                        Support Queries
                    </span>

                </a>

            </nav>

        </aside>


        <!-- =================================================
             CONTENT
             ================================================= -->

        <main class="admin-content">

            <div
                class="route-container"
                [@routeAnimations]="getRouteAnimationData()">

                <router-outlet></router-outlet>

            </div>

        </main>

    </div>

</div>


<!-- =========================================================
     ADMIN PROFILE POPOVER
     ========================================================= -->

<p-popover
    #adminPopover
    styleClass="admin-profile-popover">

    <div class="admin-user-menu">


        <!-- Profile Header -->

        <div class="admin-user-menu-header">

            <div class="admin-menu-avatar">

                @if (user?.profileImageUrl) {

                    <img
                        [src]="user?.profileImageUrl"
                        [alt]="user?.fullName || 'Profile image'">

                } @else {

                    <span>
                        {{ user?.fullName?.charAt(0)?.toUpperCase() }}
                    </span>

                }

            </div>


            <div class="admin-menu-user-info">

                <h3>
                    {{ user?.fullName }}
                </h3>

                <p>
                    {{ user?.email }}
                </p>

            </div>

        </div>


        <!-- Menu -->

        <div class="admin-user-menu-items">


            <!-- Profile -->

            <button
                type="button"
                class="admin-menu-item"
                (click)="goToProfile(); adminPopover.hide()">

                <span class="menu-icon">
                    <i class="pi pi-user"></i>
                </span>

                <span>
                    My Profile
                </span>

            </button>


            <!-- Settings -->

            <button
                type="button"
                class="admin-menu-item"
                (click)="goToSettings(); adminPopover.hide()">

                <span class="menu-icon">
                    <i class="pi pi-cog"></i>
                </span>

                <span>
                    Settings
                </span>

            </button>


            <!-- Security -->

            <button
                type="button"
                class="admin-menu-item"
                (click)="goToSecurity(); adminPopover.hide()">

                <span class="menu-icon">
                    <i class="pi pi-shield"></i>
                </span>

                <span>
                    Security
                </span>

            </button>


            <div class="menu-divider"></div>


            <!-- Switch to User -->

            <button
                type="button"
                class="admin-menu-item"
                (click)="switchToUser(); adminPopover.hide()">

                <span class="menu-icon">
                    <i class="pi pi-arrow-left"></i>
                </span>

                <span>
                    Switch to User
                </span>

            </button>


            <div class="menu-divider"></div>


            <!-- Logout -->

            <button
                type="button"
                class="admin-menu-item logout"
                (click)="logout()">

                <span class="menu-icon">
                    <i class="pi pi-sign-out"></i>
                </span>

                <span>
                    Logout
                </span>

            </button>

        </div>

    </div>

</p-popover>
