<div class="storage-card">

    <!-- Animated background elements -->
    <div class="storage-glow"></div>
    <div class="storage-orb orb-one"></div>
    <div class="storage-orb orb-two"></div>


    <!-- Header -->

    <div class="card-header">

        <div class="header-icon">

            <i class="pi pi-cloud"></i>

        </div>

        <div>

            <span class="eyebrow">
                CLOUD STORAGE
            </span>

            <h3>
                Storage
            </h3>

            <p>
                Monitor your storage usage
            </p>

        </div>

    </div>


    <!-- Storage Summary -->

    <div class="storage-summary">

        <div class="storage-number">

            <span class="used-storage">
                {{ storageUsed }}
            </span>

            <span class="total-storage">
                of {{ storageLimit }} used
            </span>

        </div>

        <div class="storage-icon">

            <i class="pi pi-database"></i>

        </div>

    </div>


    <!-- Progress -->

    <div class="progress-wrapper">

        <div class="progress-track">

            <div
                class="progress-fill"
                [style.width.%]="storagePercentage">

                <div class="progress-shine"></div>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <div class="storage-footer">

        <div class="usage">

            <span class="usage-dot"></span>

            <span>
                {{ storagePercentage }}% Used
            </span>

        </div>

        <span class="plan-badge">

            <i class="pi pi-star"></i>

            {{ storagePlan }}

        </span>

    </div>


    <!-- Storage status -->

    <div class="storage-status">

        <div>

            <i class="pi pi-check-circle"></i>

            <span>
                Storage is available
            </span>

        </div>

        <span>
            {{ storageLimit }} capacity
        </span>

    </div>

</div>
