<div class="change-password-card">

    <div class="card-header">

        <i class="pi pi-lock"></i>

        <div>

            <h3>Password Security</h3>

            <p>Manage your account password and security.</p>

        </div>

    </div>

    @if (!showChangePasswordForm) {

    <div class="password-summary">

        <div class="status-cards">

            <div class="status-card">

                <div class="status-icon">

                    <i class="pi pi-shield"></i>

                </div>

                <div class="status-details">

                    <span class="status-label">
                        Password Status
                    </span>

                    <span class="status-value success">
                        Protected
                    </span>

                </div>

            </div>

            <div class="status-card">

                <div class="status-icon">

                    <i class="pi pi-calendar"></i>

                </div>

                <div class="status-details">

                    <span class="status-label">
                        Last Changed
                    </span>

                    <span class="status-value">
                        --
                    </span>

                </div>

            </div>

            <div class="status-card">

                <div class="status-icon">

                    <i class="pi pi-lock"></i>

                </div>

                <div class="status-details">

                    <span class="status-label">
                        Password Strength
                    </span>

                    <span class="status-value success">
                        Strong
                    </span>

                </div>

            </div>

        </div>

        <div class="summary-actions">

            <button
                pButton
                type="button"
                icon="pi pi-lock"
                label="Change Password"
                (click)="showChangePasswordForm = true">
            </button>

        </div>

    </div>

    } @else {

    <form class="form-grid" [formGroup]="changePasswordForm">

        <div class="field">

            <label>Current Password</label>

       <p-password
    formControlName="currentPassword"
    [feedback]="false"
    [toggleMask]="true"
    [fluid]="true"
    placeholder="Enter current password">
</p-password>

        </div>

        <div class="field">

            <label>New Password</label>

 <p-password
    formControlName="newPassword"
    [toggleMask]="true"
    [fluid]="true"
    placeholder="Enter new password"
    promptLabel="Choose a strong password"
    weakLabel="Weak"
    mediumLabel="Medium"
    strongLabel="Strong">
</p-password>

        </div>

        <div class="field">

            <label>Confirm Password</label>

    <p-password
    formControlName="confirmPassword"
    [feedback]="false"
    [toggleMask]="true"
    [fluid]="true"
    placeholder="Confirm new password">
</p-password>

        </div>

        <div class="button-container">

            <button
                pButton
                type="button"
                label="Cancel"
                severity="secondary"
                variant="outlined"
                (click)="showChangePasswordForm = false">
            </button>

            <button
                pButton
                type="button"
                label="Update Password"
                icon="pi pi-check"
                (click)="changePassword()">
            </button>

        </div>

    </form>

    }

</div>
