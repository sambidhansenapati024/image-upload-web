<div class="help-grid">

    <!-- Documentation -->
    <div class="help-item">

        <div class="help-glow"></div>

        <div class="help-icon">
            <i class="pi pi-book"></i>
        </div>

        <div class="help-content">

            <span class="help-label">
                LEARN
            </span>

            <h3>
                Documentation
            </h3>

            <p>
                Learn how to upload files, manage storage, and use
                CloudVault features.
            </p>

        </div>

        <button
            pButton
            type="button"
            icon="pi pi-arrow-right"
            severity="secondary"
            variant="text"
            class="help-arrow"
            aria-label="Open Documentation"
            (click)="goToDocumentation()">
        </button>

    </div>


    <!-- Contact Support -->
    <div class="help-item">

        <div class="help-glow"></div>

        <div class="help-icon">
            <i class="pi pi-comments"></i>
        </div>

        <div class="help-content">

            <span class="help-label">
                ASSISTANCE
            </span>

            <h3>
                Contact Support
            </h3>

            <p>
                Need help? Reach out to our support team for
                assistance.
            </p>

        </div>

        <button
            pButton
            type="button"
            icon="pi pi-arrow-right"
            severity="secondary"
            variant="text"
            class="help-arrow"
            aria-label="Contact Support">
        </button>

    </div>


    <!-- FAQ -->
    <div class="help-item">

        <div class="help-glow"></div>

        <div class="help-icon">
            <i class="pi pi-question-circle"></i>
        </div>

        <div class="help-content">

            <span class="help-label">
                QUICK ANSWERS
            </span>

            <h3>
                Frequently Asked Questions
            </h3>

            <p>
                Browse answers to the most common questions about
                CloudVault.
            </p>

        </div>

        <button
            pButton
            type="button"
            icon="pi pi-arrow-right"
            severity="secondary"
            variant="text"
            class="help-arrow"
            aria-label="View Frequently Asked Questions">
        </button>

    </div>

</div>
