<div class="sidebar" [class.collapsed]="collapsed">

<div class="logo">

    <div class="logo-left">

        <div class="logo-icon">

            ☁️

        </div>

        <div
            class="logo-text"
            [class.hide]="collapsed">

            <h2>CloudVault</h2>

            <p>Secure Cloud Storage</p>

        </div>

    </div>

</div>

     <button class="collapse-btn" (click)="toggleSidebar()">
        <i class="pi" [ngClass]="collapsed ? 'pi-angle-right' : 'pi-angle-left'"></i>
    </button>

    <!-- Navigation -->
    <nav class="menu">

        <a routerLink="/home"
           routerLinkActive="active">

            <i class="pi pi-home"></i>

            <span  [class.hide]="collapsed">Dashboard</span>

        </a>

        <a routerLink="/upload"
           routerLinkActive="active">

            <i class="pi pi-upload"></i>

            <span  [class.hide]="collapsed">Upload</span>

        </a>

        <a routerLink="/gallery"
           routerLinkActive="active">

            <i class="pi pi-images"></i>

            <span  [class.hide]="collapsed">Gallery</span>

        </a>
        <!-- Image Studio -->

<div class="menu-group">

    <div
        class="menu-parent"
        (click)="toggleImageStudio()">

        <div class="menu-left">

            <i class="pi pi-images"></i>

            @if(!collapsed){

                <span>Image Studio</span>

            }

        </div>

        @if(!collapsed){

            <i
                class="pi"
                [ngClass]="imageStudioExpanded ? 'pi-chevron-down' : 'pi-chevron-right'">
            </i>

        }

    </div>

    @if(imageStudioExpanded && !collapsed){

        <div class="submenu">

            <a routerLink="/collage"
               routerLinkActive="active">

                <i class="pi pi-th-large"></i>

                <span>Collage Maker</span>

            </a>

            <a routerLink="/compress"
               routerLinkActive="active">

                <i class="pi pi-download"></i>

                <span>Compress Image</span>

            </a>

            <a routerLink="/background-remover"
               routerLinkActive="active">

                <i class="pi pi-eraser"></i>

                <span>Background Remover</span>

            </a>

        </div>

    }

</div>

        <a routerLink="/recycle-bin"
           routerLinkActive="active">

            <i class="pi pi-trash"></i>

            <span  [class.hide]="collapsed">Recycle Bin</span>

        </a>

    </nav>

    <!-- Storage -->

    <div class="storage"  [class.hide]="collapsed">

        <h4>Storage</h4>

        <div class="progress">

            <div class="progress-fill"></div>

        </div>

        <small>2.4 GB / 20 GB</small>

    </div>

</div>
