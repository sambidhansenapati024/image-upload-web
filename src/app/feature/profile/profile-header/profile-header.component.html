<div class="profile-header">

    <!-- Decorative background -->
    <div class="profile-glow glow-one"></div>
    <div class="profile-glow glow-two"></div>

    <div class="profile-pattern">
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- Profile content -->

    <div class="profile-left">

        <!-- Avatar -->

        <div
            class="avatar-wrapper"
            (mouseenter)="isHovering = true"
            (mouseleave)="isHovering = false">

            <div
                class="avatar"
                (click)="fileInput.click()">

                <div class="avatar-ring"></div>

                <div class="avatar-content">

                    <img
                        *ngIf="profile.profileImageUrl"
                        [src]="profile.profileImageUrl"
                        [alt]="profile.fullName">

                    <span
                        *ngIf="!profile.profileImageUrl"
                        class="initials">

                        {{ profile.fullName.charAt(0) }}

                    </span>

                </div>


                <!-- Hover overlay -->

                <div
                    class="avatar-overlay"
                    [class.show]="isHovering">

                    <div class="camera-button">

                        <i class="pi pi-camera"></i>

                    </div>

                    <span>
                        Change photo
                    </span>

                </div>


                <!-- Verified -->

                <span class="verified-badge">

                    <i class="pi pi-check"></i>

                </span>

            </div>

        </div>


        <!-- Profile details -->

        <div class="profile-details">

            <div class="name-row">

                <h2>
                    {{ profile.fullName }}
                </h2>

                <span class="profile-badge">

                    <i class="pi pi-verified"></i>

                    Verified

                </span>

            </div>


            <p class="profile-description">

                Manage your CloudVault profile and personal information.

            </p>


            <div class="profile-meta">


                <!-- Email -->

                <div class="meta-item">

                    <span class="meta-icon email-icon">

                        <i class="pi pi-envelope"></i>

                    </span>

                    <div>

                        <small>Email</small>

                        <span>
                            {{ profile.email }}
                        </span>

                    </div>

                </div>


                <!-- Joined -->

                <div class="meta-item">

                    <span class="meta-icon calendar-icon">

                        <i class="pi pi-calendar"></i>

                    </span>

                    <div>

                        <small>Member since</small>

                        <span>
                            {{ profile.joinedOn | date:'MMMM yyyy' }}
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Edit button -->

    <button
        pButton
        icon="pi pi-pencil"
        label="Edit Profile"
        class="edit-btn"
        (click)="onEditProfile()">

    </button>


    <!-- Floating decorative cards -->

    <div class="floating-decoration decoration-one">

        <i class="pi pi-user"></i>

    </div>

    <div class="floating-decoration decoration-two">

        <i class="pi pi-cloud"></i>

    </div>

    <div class="floating-decoration decoration-three">

        <i class="pi pi-shield"></i>

    </div>

</div>


<!-- Hidden file input -->

<input
    #fileInput
    type="file"
    accept="image/*"
    hidden
    (change)="onProfileImageSelected($event)">
