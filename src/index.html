  <!--
    ============================================================
    Browser compatibility
    ============================================================
    Some browser dependencies (onnxruntime-web, transformers.js)
    expect Node's `global` and `process` globals. This must run
    as a classic synchronous script (not type="module") so it
    executes before the deferred Angular module bundles load.
  -->
  <script>
    var global = window;
    var process = { env: {} };
  </script>
